name: ERP Dependency Security

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - name: Block high vulnerabilities in production dependencies
        run: npm run security:audit:prod
      - name: Record full dependency audit for triage
        if: always()
        run: npm audit --audit-level=low || true
