name: ERP Verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run verify
      - run: npm run coverage
      - run: npm rebuild electron
      - name: Run Electron E2E with hard timeout
        run: timeout --signal=TERM --kill-after=30s 12m xvfb-run -a npm run e2e
