name: ERP Windows Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run release:check
      - run: npm run dist:win
      - name: Validate installer artifact
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/ArtiSys-ERP-*-x64-Setup.exe
          if ($files.Count -lt 1) { throw 'Installer artifact missing' }
          if ($files[0].Length -lt 1MB) { throw 'Installer artifact unexpectedly small' }
      - uses: actions/upload-artifact@v4
        with:
          name: ArtiSys-ERP-Windows
          path: dist/ArtiSys-ERP-*-x64-Setup.exe
          if-no-files-found: error
