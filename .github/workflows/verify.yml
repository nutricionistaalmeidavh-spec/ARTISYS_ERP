name: ERP Verify

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm run verify
      - run: npm run coverage
      - run: npm rebuild electron
      - name: Run Electron E2E with hard timeout
        run: timeout --signal=TERM --kill-after=30s 12m xvfb-run -a npm run e2e
      - name: Upload QA visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-visual-evidence
          path: qa/screenshots/*.png
          if-no-files-found: error
          retention-days: 1
