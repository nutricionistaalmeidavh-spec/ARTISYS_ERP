<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://127.0.0.1:*; style-src 'self'; script-src 'self';"><title>ArtiSys ERP</title><link rel="stylesheet" href="styles.css"></head>
<body>
<section id="login" class="login-shell"><form id="login-form" class="card login-card"><div class="brand-mark">A</div><h1>ArtiSys ERP</h1><p>Gestão empresarial local, segura e independente.</p><label>Usuário<input id="username" data-testid="login-username" type="text" autocomplete="username" required></label><label>Senha<input id="password" data-testid="login-password" type="password" autocomplete="current-password" required></label><button data-testid="login-submit" type="submit">Entrar</button><div id="login-error" class="error" role="alert"></div></form></section>
<section id="app" class="app-shell" hidden>
<aside class="sidebar"><div class="brand"><div class="brand-mark">A</div><div><strong>ArtiSys ERP</strong><small id="server-status">Local</small></div></div><nav id="nav"><button data-view="dashboard" class="active">Dashboard</button><button data-view="cadastros">Cadastros</button><button data-view="estoque">Estoque</button><button data-view="compras">Compras</button><button data-view="vendas">Vendas</button><button data-view="financeiro">Financeiro</button><button data-view="relatorios">Relatórios</button><button data-view="configuracoes">Configurações</button></nav><button id="logout" class="secondary">Sair</button></aside>
<main><header class="topbar"><div><h2 id="view-title">Dashboard</h2><p id="view-subtitle">Visão geral do negócio</p></div><div id="user-badge"></div></header><section id="content" class="content"></section></main>
</section>
<script src="api-client.js"></script><script src="app.js"></script></body></html>
